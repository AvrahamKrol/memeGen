<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/helper.css" />
    <link rel="stylesheet" href="css/main.css" />
    <title>MemeGen</title>
  </head>
  <body onload="onInit()" onresize="resizeCanvas()">
    <header>
      <img src="LOGO/LOGO.png" alt="logo" />
      <nav>
        <a href="gallery.html" class="btn-clear">Gallery</a>
        <a href="about.html" class="btn-clear">About</a>
      </nav>
    </header>
    <main>
      <section class="editor">
        <article class="canvas-container">
          <canvas id="memeGen"> </canvas>
        </article>
        <article class="controls">
          <div class="input-container">
            <input type="text" oninput="onSetText(this)" />
            <div class="controls-btns">
              <button class="ctrl-btn">
                <img
                  src="icons/up-and-down-opposite-double-arrows-side-by-side.png"
                  alt="up and down"
                />
              </button>
              <button class="ctrl-btn">
                <img src="icons/add.png" alt="add" />
              </button>
              <button class="ctrl-btn">
                <img src="icons/trash.png" alt="trash" />
              </button>
            </div>
          </div>
          <div class="typo-container"></div>
          <div class="emoji-container"></div>
          <button class="btn-share">Share</button>
        </article>
      </section>
    </main>
    <footer>
      <img src="LOGO/LOGO.png" alt="logo" />
      <p>All rights reserved 2026</p>
    </footer>
    <script src="js/services/memeService.js"></script>
    <script src="js/memeController.js"></script>
  </body>
</html>
