<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/helper.css" />
    <link rel="stylesheet" href="css/main.css" />
    <title>MemeGen</title>
  </head>
  <body onload="onInit()">
    <header>
      <img src="LOGO/LOGO.png" alt="logo" />
      <nav>
        <a href="#" class="list-reset" onclick="onChangeSection()">Editor</a>
        <a href="#" class="list-reset">About</a>
      </nav>
    </header>
    <main>
      <section class="grid-container hidden"></section>
      <section class="editor-container hidden">
        <article class="canvas-container">
          <canvas id="memeGen"> </canvas>
        </article>
        <article class="controls">
          <div class="input-container">
            <input type="text" oninput="onSetText(this)" />
            <div class="controls-btns">
              <button class="ctrl-btn" onclick="onSwitchLine()">
                <img
                  src="icons/up-and-down-opposite-double-arrows-side-by-side.png"
                  alt="up and down"
                />
              </button>
              <button class="ctrl-btn">
                <img src="icons/add.png" alt="add" onclick="onAddLine()" />
              </button>
              <button class="ctrl-btn">
                <img
                  src="icons/trash.png"
                  alt="trash"
                  onclick="onRemoveLine()"
                />
              </button>
            </div>
          </div>
          <div class="typo-container">
            <div class="controls-btns">
              <button class="ctrl-btn" onclick="onSetFontSize(2)">
                <img src="icons/increase-font-icon.png" alt="increase" />
              </button>
              <button class="ctrl-btn" onclick="onSetFontSize(-2)">
                <img src="icons/decrease-font-icon.png" alt="decrease" />
              </button>
              <button class="ctrl-btn" onclick="onAlign('left')">
                <img src="icons/align-to-left.png" alt="trash" />
              </button>
              <button class="ctrl-btn" onclick="onAlign('center')">
                <img src="icons/center-text-alignment.png" alt="trash" />
              </button>
              <button class="ctrl-btn" onclick="onAlign('right')">
                <img src="icons/align-to-right.png" alt="trash" />
              </button>
              <select
                class="ctrl-btn ctrl-btn-font"
                name="font"
                id="font"
                onchange="onSetFont(this.value)"
              >
                <option value="montserrat">Montserrat</option>
                <option value="arial">Arial</option>
                <option value="comic sans ms">Comic Sans MS</option>
                <option value="impact">Impact</option>
              </select>
              <label class="ctrl-btn stroke-color">
                <img src="icons/text-stroke.png" alt="stroke color" />
                <input type="color" oninput="onSetStrokeColor(this.value)" />
              </label>
              <label class="ctrl-btn fill-color">
                <img src="icons/paint-board-and-brush.png" alt="fill color" />
                <input type="color" oninput="onSetFillColor(this.value)" />
              </label>
            </div>
          </div>
          <div class="emoji-container"></div>
          <div class="share-container">
            <a
              class="btn-share list-reset"
              href="#"
              onclick="downloadCanvas(this)"
              download="file-name"
              >Download</a
            >
            <!-- <button class="btn-share">Share</button> -->
          </div>
        </article>
      </section>
    </main>
    <footer>
      <img src="LOGO/LOGO.png" alt="logo" />
      <p>All rights reserved 2026</p>
    </footer>
    <script src="js/services/utilsService.js"></script>
    <script src="js/services/memeService.js"></script>
    <script src="js/memeController.js"></script>
    <script src="js/galleryController.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
